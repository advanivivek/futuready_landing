name: Refresh the cities

# Rebuilds the site on Vercel every morning, so the parts made at build (the page's text for search engines, its
# event data and llms.txt) list the current cities. The train itself is always current (api/cities.js). Needs one
# repository secret, VERCEL_DEPLOY_HOOK (Vercel > the project > Settings > Git > Deploy Hooks). Until it is added,
# this does nothing.
on:
  schedule:
    - cron: '30 0 * * *' # 06:00 in India
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Add the VERCEL_DEPLOY_HOOK secret to turn this on."; exit 0; fi
          curl -fsS -X POST "$HOOK"
